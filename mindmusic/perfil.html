<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MindMusic — Perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="photo-hero" aria-hidden="true"></div>

<div id="perfil-container" class="page">
  <header class="app-header">
    <div class="brand"><svg class="brand-icon" viewBox="0 0 120 64" fill="none" aria-hidden="true"><defs><linearGradient id="mmWaveHeader" x1="0" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#8FD9E8"/><stop offset="50%" stop-color="#6E8EE8"/><stop offset="100%" stop-color="#B3A6EE"/></linearGradient></defs><path d="M4,46 C12,46 12,26 20,26 C27,26 27,46 34,46 C41,46 41,6 48,6 C54,6 54,58 60,58 C66,58 66,6 72,6 C79,6 79,46 86,46 C93,46 93,26 100,26 C108,26 108,46 116,46" stroke="url(#mmWaveHeader)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="brand-text">MINDMUSIC<small>by Playtown</small></span></div>
  </header>

  <div class="profile-head">
    <div class="avatar" id="perfil-avatar" style="width:76px;height:76px;font-size:26px">I</div>
    <h2 id="perfil-name">Invitado</h2>
    <p>Miembro MindMusic</p>
  </div>

  <div class="form-block">
    <div class="form-row">
      <div>
        <div class="label">Nombre</div>
        <div class="value" id="perfil-name-value">Invitado</div>
      </div>
      <button class="edit-link" id="edit-name-btn">Editar</button>
    </div>
  </div>

  <h1 class="page-title">Configuración</h1>
  <p class="page-sub">Preferencias de la app y datos guardados en este dispositivo.</p>

  <div class="form-block">
    <div class="form-row">
      <div>
        <div class="label">Versión</div>
        <div class="value">MindMusic 1.0</div>
      </div>
    </div>
    <div class="form-row">
      <div>
        <div class="label">Club</div>
        <div class="value">Playtown</div>
      </div>
    </div>
  </div>

  <button class="danger-btn" id="reset-data-btn">Borrar datos locales</button>
</div>

<div class="modal-backdrop" id="edit-modal">
  <div class="modal-sheet">
    <h3>Editar nombre</h3>
    <input id="modal-input" type="text" placeholder="Tu nombre" maxlength="30">
    <div class="modal-actions">
      <button class="cancel" id="modal-cancel">Cancelar</button>
      <button class="save" id="modal-save">Guardar</button>
    </div>
  </div>
</div>

<nav class="app-nav">
  <div class="nav-top"><div class="brand"><svg class="brand-icon" viewBox="0 0 120 64" fill="none" aria-hidden="true"><defs><linearGradient id="mmWaveNav" x1="0" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#8FD9E8"/><stop offset="50%" stop-color="#6E8EE8"/><stop offset="100%" stop-color="#B3A6EE"/></linearGradient></defs><path d="M4,46 C12,46 12,26 20,26 C27,26 27,46 34,46 C41,46 41,6 48,6 C54,6 54,58 60,58 C66,58 66,6 72,6 C79,6 79,46 86,46 C93,46 93,26 100,26 C108,26 108,46 116,46" stroke="url(#mmWaveNav)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="brand-text">MINDMUSIC<small>by Playtown</small></span></div></div>
  <div class="nav-links">
    <a class="nav-item" id="nav-home" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Inicio</span>
    </a>
    <a class="nav-item" id="nav-explorar" href="explorar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15 9-4 2-2 4 4-2z"/></svg>
      <span>Explorar</span>
    </a>
    <a class="nav-item" id="nav-perfil" href="perfil.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg>
      <span>Perfil</span>
    </a>
  </div>
  <div class="nav-bottom">
    <a class="nav-user" href="perfil.html">
      <div class="avatar js-avatar">I</div>
      <div>
        <p class="nav-user-name">Invitado</p>
        <p class="nav-user-sub">Miembro MindMusic</p>
      </div>
    </a>
  </div>
</nav>

<script src="app-data.js"></script>
<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MindMusic — Playlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body class="no-nav">
<div class="photo-hero" aria-hidden="true"></div>

<div id="playlist-container" class="page">
  <header class="app-header">
    <a class="back-btn" href="javascript:history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Volver
    </a>
    <a class="avatar js-avatar" href="perfil.html">I</a>
  </header>

  <div id="playlist-loading" class="loading-wrap">
    <div class="spinner"></div>
    Cargando...
  </div>

  <div id="playlist-content" style="display:none">
    <div class="playlist-head">
      <div class="cover cover--stack" id="playlist-cover"></div>
      <div class="meta">
        <span class="playlist-kind">Playlist</span>
        <h1 id="playlist-title"></h1>
        <p id="playlist-desc"></p>
      </div>
    </div>

    <div class="section-head">
      <h2>Temas de esta playlist</h2>
    </div>
    <div class="tracklist" id="playlist-tracklist"></div>
  </div>
</div>

<script src="app-data.js"></script>
<script src="app.js"></script>
</body>
</html>

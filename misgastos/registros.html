<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mis Gastos en Orden — Vencimientos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<meta name="theme-color" content="#eaf3f1">
</head>
<body>

<header class="app-header">
  <div class="brand-mark"><img class="brand-icon" src="assets/brand/logo-mark.svg" alt="" aria-hidden="true"><div class="brand-logo">Mis Gastos en Orden<small>by PLAYTOWN</small></div></div>
</header>

<div id="registros-container" class="page">
  <h1 class="page-title">Vencimientos</h1>
  <p class="page-sub">Mantén tus cuentas claras y tu mente en paz.</p>

  <button class="reg-hero" id="new-fixed-btn">
    <div class="reg-hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg></div>
    <div class="reg-hero-body">
      <h2>Nuevo Gasto Fijo</h2>
      <p>Suscripciones, arriendo, servicios y más</p>
    </div>
    <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>

  <div class="section-head"><h2>Tus vencimientos</h2></div>
  <div class="subs-list" id="subs-list"></div>
</div>

<!-- Modal: Gasto Fijo / vencimiento recurrente -->
<div class="modal-backdrop" id="subscription-modal">
  <div class="modal-sheet">
    <h3 id="subscription-modal-title">Nuevo Gasto Fijo</h3>
    <div class="field">
      <label for="subscription-name">Nombre</label>
      <input id="subscription-name" type="text" placeholder="Ej: Netflix, arriendo, luz...">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="subscription-amount">Monto (CLP)</label>
        <input id="subscription-amount" type="number" min="0" step="1" placeholder="0">
      </div>
      <div class="field">
        <label for="subscription-category">Categoría</label>
        <select id="subscription-category"></select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="subscription-day">Día de vencimiento</label>
        <input id="subscription-day" type="number" min="1" max="31" placeholder="1–31">
      </div>
      <div class="field">
        <label for="subscription-reminder">Avisar</label>
        <select id="subscription-reminder">
          <option value="3">3 días antes</option>
          <option value="5" selected>5 días antes</option>
          <option value="7">7 días antes</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="cancel" id="subscription-cancel">Cancelar</button>
      <button class="save" id="subscription-save">Guardar</button>
    </div>
  </div>
</div>

<nav class="app-nav">
  <div class="nav-top"><div class="brand-mark"><img class="brand-icon" src="assets/brand/logo-mark.svg" alt="" aria-hidden="true"><div class="brand-logo">Mis Gastos en Orden<small>by PLAYTOWN</small></div></div></div>
  <div class="nav-links">
    <a class="nav-item" id="nav-home" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Inicio</span>
    </a>
    <a class="nav-item" id="nav-registros" href="registros.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>Vencimientos</span>
    </a>
    <a class="nav-item" id="nav-retos" href="retos.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
      <span>Retos</span>
    </a>
    <a class="nav-item" id="nav-perfil" href="perfil.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg>
      <span>Perfil</span>
    </a>
  </div>
  <div class="nav-bottom">
    <a class="nav-user" href="perfil.html">
      <div class="avatar js-avatar">I</div>
      <div>
        <p class="nav-user-name">Invitado</p>
        <p class="nav-user-sub">Miembro Playtown</p>
      </div>
    </a>
  </div>
</nav>

<script src="app-data.js"></script>
<script src="app.js"></script>
</body>
</html>

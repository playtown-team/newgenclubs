<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mis Gastos en Orden">
  <rect width="512" height="512" rx="112" fill="#ffffff"/>
  <g transform="translate(112 118) scale(2.88)">
  <defs>
    <linearGradient id="mgoLight" x1="0" y1="100" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6fded4"/>
      <stop offset=".55" stop-color="#31c3ba"/>
      <stop offset="1" stop-color="#11a79b"/>
    </linearGradient>
    <linearGradient id="mgoCoin" x1="49" y1="52" x2="96" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ecfc5"/>
      <stop offset="1" stop-color="#0f9b8f"/>
    </linearGradient>
  </defs>

  <!-- curva de crecimiento bajo las barras -->
  <path d="M2 68C4.6 85.4 21.4 96.5 47.5 96.5L2 96.5Z" fill="url(#mgoLight)"/>

  <!-- barras ascendentes -->
  <rect x="1.5" y="51" width="16" height="31.5" rx="5" fill="url(#mgoLight)"/>
  <rect x="21" y="34" width="16" height="48.5" rx="5" fill="url(#mgoLight)"/>
  <rect x="40.5" y="13" width="17" height="69.5" rx="5" fill="url(#mgoLight)"/>

  <!-- cinta / marcador -->
  <path d="M63 22.5a4.5 4.5 0 0 1 4.5-4.5h24a4.5 4.5 0 0 1 4.5 4.5V45l-16.5-9.5L63 45Z" fill="url(#mgoLight)"/>

  <!-- check -->
  <path d="M60.5 27.5L71 39.5L95.5 4.5" fill="none" stroke="#3ed3c8" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- moneda -->
  <circle cx="72" cy="75" r="23.5" fill="url(#mgoCoin)"/>
  <path d="M72 57V90.5" fill="none" stroke="#fff" stroke-width="3.3" stroke-linecap="round"/>
  <path d="M79.8 67C79.8 63.2 76.3 61 72 61C67.9 61 64.4 63.1 64.4 66.6C64.4 70.5 68.3 72 72 73.2C76.3 74.6 80.2 76.1 80.2 80.1C80.2 84 76.5 86.3 72 86.3C67.7 86.3 63.9 84.4 63.9 80.8" fill="none" stroke="#fff" stroke-width="3.3" stroke-linecap="round"/>
</g>
</svg>
